<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E05C2A">
  <meta name="description" content="Bantu Tono hadapi hari-hari di Jakarta lewat puzzle panah.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life of Tono">
  <title>Life of Tono</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN: Title
══════════════════════════════════════════ -->
<main id="screen-title" class="screen">
  <div class="title-logo">Life of <em>Tono</em></div>
  <p class="title-sub">Bantu Tono hadapi hari-hari di Jakarta.<br>Putar panah, buka jalan, sampai tujuan.</p>
  <button id="btn-start" class="btn-primary">Mulai ▶</button>
  <button id="btn-open-map" class="btn-secondary">🗺️ Pilih Level</button>
</main>

<!-- ══════════════════════════════════════════
     SCREEN: Play
══════════════════════════════════════════ -->
<main id="screen-play" class="screen" hidden>

  <!-- Top bar: back | level info | reset -->
  <div class="play-topbar">
    <button id="btn-back" class="btn-icon" title="Kembali ke peta" aria-label="Kembali ke peta">←</button>
    <div class="move-counter">
      Langkah: <strong id="move-count">0</strong>
    </div>
    <button id="btn-reset" class="btn-icon" title="Ulangi level" aria-label="Ulangi level">↺</button>
  </div>

  <!-- Level header -->
  <div class="level-header">
    <div class="level-emoji-wrap" id="level-emoji">🛢️</div>
    <div class="level-info">
      <div class="level-id-label" id="level-id">Level 1-1</div>
      <div class="level-mission-text" id="level-mission">Misi</div>
    </div>
    <span class="mechanic-badge mechanic-basic" id="mechanic-badge">basic</span>
  </div>

  <!-- Game grid (cells injected by ui.js) -->
  <div id="game-grid" role="grid" aria-label="Grid puzzle"></div>

  <!-- Hint -->
  <p class="hint-strip">Ketuk sel untuk memutar arah panah 🔄</p>

</main>

<!-- ══════════════════════════════════════════
     SCREEN: Level Map
══════════════════════════════════════════ -->
<main id="screen-map" class="screen" hidden>
  <div class="map-header">
    <button id="btn-map-back" class="btn-icon" aria-label="Kembali">←</button>
    <div class="map-title">Peta Level</div>
  </div>
  <div id="map-levels" role="list" aria-label="Daftar level"></div>
</main>

<!-- ══════════════════════════════════════════
     OVERLAY: Win
══════════════════════════════════════════ -->
<div id="overlay-win" class="overlay" role="dialog" aria-modal="true" aria-label="Level selesai" hidden>
  <div class="overlay-card">
    <div class="overlay-emoji">🎉</div>
    <div class="overlay-title">Berhasil!</div>
    <p class="overlay-sub" id="win-message">Tono sampai tujuan. Misi selesai!</p>
    <div class="overlay-actions">
      <button id="btn-next" class="btn-primary">Level Berikutnya →</button>
      <button id="btn-win-map" class="btn-secondary">🗺️ Lihat Peta</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     OVERLAY: Lost
══════════════════════════════════════════ -->
<div id="overlay-lost" class="overlay" role="dialog" aria-modal="true" aria-label="Level gagal" hidden>
  <div class="overlay-card">
    <div class="overlay-emoji">🌊</div>
    <div class="overlay-title">Kebanjiran!</div>
    <p class="overlay-sub">Tono kena banjir sebelum sampai tujuan. Coba lagi?</p>
    <div class="overlay-actions">
      <button id="btn-retry" class="btn-primary">↺ Coba Lagi</button>
      <button id="btn-lost-map" class="btn-secondary">🗺️ Lihat Peta</button>
    </div>
  </div>
</div>

<!-- Scripts — load in dependency order -->
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>

<script>
  // Register service worker for PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // SW registration failed — app still works online
      });
    });
  }
</script>

</body>
</html>
